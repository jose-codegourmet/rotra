<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>ROTRA — Courts</title>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" />
  <style>
    :root {
      --bg: #0B0B0C;
      --surface: #1A1A1D;
      --elevated: #2A2A2E;
      --overlay: #3A3A3F;
      --text: #F0F0F2;
      --text-2: #9090A0;
      --disabled: #4A4A55;
      --accent: #00FF88;
      --accent-dim: #00CC6A;
      --accent-subtle: #00FF8820;
      --error: #FF4D4D;
      --warning: #FFB800;
      --border: #2A2A2E;
      --border-strong: #404048;
      --font: 'Satoshi', Inter, system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #111114;
      min-height: 100%;
      font-family: var(--font);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }

    .phone {
      width: 390px;
      height: 844px;
      background: var(--bg);
      border-radius: 44px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px #2A2A2E,
        0 0 0 10px #1A1A1D,
        0 24px 64px rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 50px;
      padding: 12px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: relative;
      z-index: 4;
    }

    .status-time {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      width: 54px;
    }

    .notch {
      position: absolute;
      left: 50%;
      top: 8px;
      transform: translateX(-50%);
      width: 118px;
      height: 26px;
      background: #000;
      border-radius: 18px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 70px;
      justify-content: flex-end;
    }

    .status-icons svg { display: block; }

    .app-header {
      padding: 2px 16px 6px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand { display: flex; flex-direction: column; gap: 1px; }

    .wordmark {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.7px;
      line-height: 1;
      text-transform: uppercase;
    }

    .tagline {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2px;
      color: var(--text-2);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 8px;
      background: var(--accent-subtle);
      border: 1px solid rgba(0,255,136,0.22);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--accent);
    }

    .chip-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      height: 40px;
      background: var(--elevated);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
      margin: 4px 16px 6px;
      flex-shrink: 0;
    }

    .tab {
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-2);
      font-family: var(--font);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    .tab.active {
      background: var(--accent-subtle);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(0,255,136,0.18);
    }

    .scroll {
      flex: 1;
      overflow: hidden;
      padding: 2px 16px 0;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }

    .status-first { margin: 2px 0 10px; }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-2);
      margin-bottom: 5px;
    }

    .live-pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(0,255,136,0.55);
    }

    .display {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.8px;
      line-height: 1.1;
    }

    .sub {
      margin-top: 5px;
      font-size: 13px;
      font-weight: 400;
      color: var(--text-2);
      line-height: 1.35;
    }

    .dock {
      flex-shrink: 0;
      padding: 8px 16px 8px;
      background: var(--bg);
    }

    .home-ind {
      margin: 4px auto 6px;
      width: 134px;
      height: 5px;
      background: #F0F0F2;
      border-radius: 99px;
      opacity: 0.85;
    }

    @media (max-width: 430px) {
      body { padding: 0; background: var(--bg); }
      .phone {
        border-radius: 0;
        box-shadow: none;
        width: 100vw;
        height: 100vh;
        max-width: 480px;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      margin-bottom: 8px;
    }

    .court-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .court-name {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .court-name svg {
      width: 16px;
      height: 16px;
      stroke: var(--text-2);
      flex-shrink: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .badge .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    .badge-active {
      background: var(--accent-subtle);
      color: var(--accent);
      border: 1px solid rgba(0,255,136,0.22);
    }
    .badge-active .dot {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .badge-empty {
      background: rgba(144,144,160,0.10);
      color: var(--text-2);
      border: 1px solid var(--border-strong);
    }
    .badge-empty .dot { background: var(--text-2); }

    .matchup {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 8px;
    }

    .team-k {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--text-2);
      margin-bottom: 4px;
    }

    .team-n {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
      line-height: 1.3;
    }

    .team-b { text-align: right; }

    .vs {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--disabled);
      padding-top: 18px;
    }

    .score {
      margin-top: 14px;
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -1.6px;
      line-height: 1;
      text-align: center;
    }

    .elapsed {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
    }

    .elapsed svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-2);
    }

    .empty-prompt {
      padding: 18px 8px 8px;
      text-align: center;
    }

    .empty-prompt svg {
      width: 22px;
      height: 22px;
      stroke: var(--text-2);
      margin: 0 auto 8px;
      display: block;
    }

    .empty-prompt p {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-2);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="phone" id="frame">
    <div class="status-bar">
      <div class="status-time">7:12</div>
      <div class="notch"></div>
      <div class="status-icons" aria-hidden="true">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
          <rect x="0" y="8" width="3" height="4" rx="0.6" fill="#F0F0F2"/>
          <rect x="4.5" y="5" width="3" height="7" rx="0.6" fill="#F0F0F2"/>
          <rect x="9" y="2.5" width="3" height="9.5" rx="0.6" fill="#F0F0F2"/>
          <rect x="13.5" y="0" width="3" height="12" rx="0.6" fill="#F0F0F2" opacity="0.35"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
          <path d="M8 3.2c2.1 0 4 1.1 5.2 2.8M2.6 4.2C4.3 2.4 6.1 1.6 8 1.6c1.9 0 3.7.8 5.4 2.6M4.4 6.2C5.5 5 6.7 4.4 8 4.4c1.3 0 2.5.6 3.6 1.8" stroke="#F0F0F2" stroke-width="1.3" stroke-linecap="round"/>
          <circle cx="8" cy="9.4" r="1.15" fill="#F0F0F2"/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none">
          <rect x="0.6" y="0.6" width="22.5" height="11.8" rx="3.2" stroke="#F0F0F2" stroke-width="1.2"/>
          <rect x="2.2" y="2.2" width="17.2" height="8.6" rx="1.8" fill="#F0F0F2"/>
          <path d="M24.6 4.4v4.2c.9-.4 1.4-1.1 1.4-2.1s-.5-1.7-1.4-2.1z" fill="#F0F0F2"/>
        </svg>
      </div>
    </div>

    <header class="app-header">
      <div class="brand">
        <div class="wordmark">ROTRA</div>
        <div class="tagline">Run the game.</div>
      </div>
      <div class="chip"><span class="chip-dot"></span>You · JO</div>
    </header>
    <nav class="tabs" aria-label="Session views">
      <a class="tab active" href="player-courts.html">Courts</a>
      <a class="tab" href="player-queue.html">Queue</a>
      <a class="tab" href="player-standings.html">Standings</a>
    </nav>

    <main class="scroll">
      <section class="status-first">
        <div class="live-pill"><span class="dot"></span>1 live court</div>
        <h1 class="display">Courts</h1>
        <p class="sub">Smash Hub Ortigas · 7:00–9:00 PM · Doubles</p>
      </section>

      <section class="card">
        <div class="court-head">
          <div class="court-name">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="5.5" width="17" height="13" rx="2"/>
              <path d="M3.5 12h17M12 5.5v13"/>
            </svg>
            Court 1
          </div>
          <div class="badge badge-active"><span class="dot"></span>Active</div>
        </div>
        <div class="matchup">
          <div>
            <div class="team-k">Team A</div>
            <div class="team-n">Jae Lim<br>Mia Reyes</div>
          </div>
          <div class="vs">vs</div>
          <div class="team-b">
            <div class="team-k">Team B</div>
            <div class="team-n">Kai Tan<br>Lia Santos</div>
          </div>
        </div>
        <div class="score">11–8</div>
        <div class="elapsed">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8.2"/>
            <path d="M12 8v4.4l2.8 1.8"/>
          </svg>
          08:24 elapsed
        </div>
      </section>

      <section class="card">
        <div class="court-head">
          <div class="court-name">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="5.5" width="17" height="13" rx="2"/>
              <path d="M3.5 12h17M12 5.5v13"/>
            </svg>
            Court 2
          </div>
          <div class="badge badge-empty"><span class="dot"></span>Empty</div>
        </div>
        <div class="empty-prompt">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="5.5" width="17" height="13" rx="2"/>
            <path d="M3.5 12h17M12 5.5v13"/>
          </svg>
          <p>No match on this court. Next pairing is waiting in queue.</p>
        </div>
      </section>
    </main>
    <div class="dock">
      <div class="home-ind"></div>
    </div>
  </div>
</body>
</html>
